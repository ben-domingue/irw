# The first workflow in this repository that runs any of its code.
#
# The three that came before it -- "To Do.yml", "In Progress.yml",
# "Under Review.yml" -- are GitHub Projects card-movers: they never check out
# the repo and never execute a line of it. So until now, "did this change break
# the shared tooling?" was a question only a human could answer by cloning.
#
# That is the reported cause of the pull-request backlog: five of the eight open
# PRs have no review at all, and every submission needs manual adjudication
# because nothing mechanical can speak first. This makes the mechanical part
# mechanical.
#
# Deliberately narrow. It runs the two test suites and nothing else -- no
# network, no credentials, no Redivis, no dataset downloads. A test job that
# depends on a third party's uptime teaches people to ignore red marks.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # Nothing bounded this job, so a stuck step ran to GitHub's 6h default.
    # The suite's own work is ~4 minutes; 30 turns a hang into a fast,
    # re-runnable failure instead of an afternoon (#1775 follow-on).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pandas for irw_validate; redivis because red_up.cli imports it at
          # module scope even though no test here touches the network. The
          # first run of this workflow failed on exactly that -- installing
          # with --no-deps left one pre-existing test unable to import cli.
          python -m pip install pandas
          # xlrd for the BIFF2/3/4 .xls path in irw_triage_updated's reader.
          # It is already in OPTIONAL_READERS, so a pipeline run installs it
          # via preflight_deps() -- but this job did not, so the regression
          # test for that path errored here while passing everywhere else and
          # turned main red (#3157 -> #3158). Installed rather than skipped:
          # a test that quietly skips is how a reader regression gets through.
          python -m pip install xlrd
          python -m pip install -e .
          # irw_validate is its own distribution now, not a rider on
          # irw-red-up. Installing it here is also what checks its pyproject
          # still builds -- the pipeline itself does not need the install,
          # because red_up and irw_triage_updated both put the repo root on
          # sys.path before importing it.
          python -m pip install -e irw_validate

      - name: red_up
        run: python -m unittest discover -s red_up/tests -t . -v

      - name: irw_validate
        run: python -m unittest discover -s irw_validate/tests -t . -v

      # The dictionary staging writer (#1732) and the DOI normaliser it calls
      # (#1690). The writer's load-bearing test is that a value beginning "-",
      # "=", "+" or "@" is written unchanged: the first version escaped those
      # for the Sheets paste path, which this replaces, and the apostrophe
      # corrupted three real Notes cells. The normaliser's is that stripping a
      # `https://doi.org/` wrapper never changes WHICH object the DOI names --
      # a data DOI stays a data DOI, and is reported rather than rewritten.
      - name: stage_dict_row
        run: python -m unittest discover -s automated_finding/tests -t . -v

      # The item-text liveness snapshot (#1828). Offline by construction: the
      # Redivis call lives in fetch(), and what is checked here is the file
      # contract between the Python writer and the R checker that reads it.
      - name: itemtext live_tables
        run: python -m unittest discover -s itemtext/tests -t . -v

      # The R validator is the copy external contributors source from a raw
      # GitHub URL, so it has to keep parsing even though nothing here imports
      # it. irw_validate's parity test checks that its `# @check` markers still
      # match CORE_CHECKS; this checks it is still valid R.
      - name: covariate_labels generator and table (#1775)
        run: python metadata/tests/test_covariate_labels.py -v

      # The gap auditor, and then the ratchet itself. A covariate-label gap is
      # invisible by construction -- the harvest is a manual stage, so a script
      # nobody harvests produces no error, no empty file and no row anywhere,
      # which is how cassidy_2024_* shipped nine tables of coded, fully
      # labelled covariates with none of them reaching the table page. The
      # auditor reconstructs the gap from the committed record alone (no
      # ~/.cache logs, no network), so it can run here.
      #
      # --ratchet, not --strict: --strict fails today on 447 live tables, so as
      # a gate it would block every PR and be switched off within a week. The
      # ratchet grandfathers whatever gaps.csv records and fails only on a
      # table that is NEWLY in the gap, so the backlog can shrink but not grow
      # unnoticed. Known limit: a table enters the report only once it is live,
      # so a new script is caught on the first run after release rather than in
      # the PR that adds it.
      - name: covariate_labels gap auditor (#1775)
        run: python metadata/tests/test_covariate_gaps.py -v

      - name: covariate_labels gap ratchet (#1775)
        run: python metadata/covariate_labels/audit_gaps.py --ratchet

      # Stage 14 imports stage 13, so both run here (#2494, #2763).
      - name: script index and column docs (stages 13, 14)
        run: |
          python metadata/tests/test_script_index.py -v
          python metadata/tests/test_column_docs.py -v

      # Codebook links (#2766, #2770) and the label-harvest advisory.
      - name: codebook links and label-harvest check
        run: |
          python metadata/tests/test_find_codebook_links.py -v
          python metadata/tests/test_check_label_harvest.py -v

      # Tier-0 item statistics (#1710): the rotation's batch packing and what
      # the four metadata.csv columns mean. Offline -- no Redivis.
      - name: tier-0 item statistics (stage 19)
        run: python metadata/tests/test_item_classical.py -v

      # k=1 respondent uniqueness (#3273): which columns count as
      # quasi-identifiers, and a digest pinning that regex, since editing it
      # silently changes published numbers. Offline -- no Redivis. The corpus
      # reproduction of #3232's 2,942-table work set is deliberately opt-in
      # (K1_BASELINE=1): the count rises when a table with three covariates is
      # ingested, which is growth, not a defect.
      - name: k=1 respondent uniqueness (stage 20)
        run: python metadata/tests/test_k1.py -v

      # Drift-report name normalisation. Offline.
      - name: drift report names
        run: python metadata/tests/test_drift_names.py -v

      # R used to come from `apt-get install r-base-core r-cran-*` here, run
      # cold on every job. When a Debian mirror was slow that one step took
      # hours -- 2026-10-26 saw four runs of 1h47m to over 4h against a
      # ~4-minute suite, all parked in the apt call. setup-r caches R itself
      # and `use-public-rspm` serves the packages as prebuilt binaries, so
      # there is no compile and no apt. `gsheet` joins the same install
      # (its own step used to shell out to cloud.r-project.org under sudo);
      # 03_tags.R loads it for test_tags_union.R, which holds the only
      # assertion that verbatim paper excerpts cannot reach a public CSV
      # (#1863). readr/httr/stringr are what the R tests import. Nothing
      # here fetches a sheet.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The list is longer than the four apt packages it replaces because
      # apt's dependency closure is WIDER than the CRAN declared one: the
      # `r-cran-*` packages dragged in `r-cran-dplyr` and friends, and the R
      # under test imported them without anything naming them. Installing only
      # the four named packages failed test_dict_union.R on
      # "there is no package called dplyr". These are every package that
      # `misc/validate_irw.R`, `metadata/*.R` and the R tests load, minus
      # `quanteda`/`quanteda.textstats` (apt never supplied them either, so no
      # exercised path needs them) and `redivis`/`irw`, which are not wanted in
      # an offline suite.
      - name: R packages
        run: |
          Rscript -e 'pkgs <- c("readr", "httr", "stringr", "gsheet", "dplyr", "tidyr", "purrr", "glue", "jsonlite", "progress", "tibble")' \
                  -e 'install.packages(pkgs)' \
                  -e 'invisible(lapply(pkgs, library, character.only = TRUE))'

      - name: validate_irw.R still parses
        run: Rscript misc/tests/smoke_validate_irw.R

      - name: Curated BibTeX corrections
        working-directory: metadata
        run: Rscript tests/test_bibtex_overrides.R

      # A cached citation must name its own row's DOI (#2301). 58 biblio rows
      # shipped a BibTeX entry for a different, real, unrelated paper: the
      # sheet's enumerated DOIs were corrected (#1764), and the citations
      # fetched against the old values were never invalidated, because they
      # were not blank. The last assertions in this test run the gate over the
      # four shipped biblio exports, so a stale citation fails the pull request
      # that would ship it rather than being found by reading a bibliography.
      - name: BibTeX cites the row's own DOI
        working-directory: metadata
        run: Rscript tests/test_bibtex_doi_check.R

      # The itemtext_metadata prune (#3224). 08_itemtext.R only ever added
      # rows, so a withdrawn table kept its row for ever -- 199 of 2,921 on
      # 2026-10-25. What this test is really guarding is the guard: a listing
      # that failed must not be read as a corpus whose item text was withdrawn,
      # and the deletion is of PUBLISHED rows, so it has to refuse rather than
      # proceed when the listing looks wrong.
      - name: itemtext_metadata prune guard
        working-directory: metadata
        run: Rscript tests/test_itemtext_prune.R

      # The dictionary union (#1732). Runs offline -- dict_union.R touches no
      # network -- so the merge rule is checked on every PR rather than only
      # when someone remembers to run it. Its load-bearing assertion is that a
      # human's non-empty cell is never overwritten.
      - name: dictionary union
        working-directory: metadata
        run: Rscript tests/test_dict_union.R

      # Offline tests that existed but never ran here (found 2026-10-03).
      - name: tags union
        working-directory: metadata
        run: Rscript tests/test_tags_union.R
      - name: stragglers, dictionary DOIs, BibTeX reference refresh
        working-directory: metadata
        run: |
          Rscript tests/test_stragglers.R
          Rscript tests/test_dictionary_dois.R
          Rscript tests/test_bibtex_reference_refresh.R

      # Redivis config parity (#1733). The dataset list is declared once per
      # language -- here, in Rpkg, and in Python-pkg -- and nothing compared
      # the three. They had already drifted: Python-pkg carried no reference to
      # irw_nominal, so that source was reachable from R and not from Python
      # for months, and it was found by hand rather than by anything mechanical.
      #
      # The issue proposed hanging this off the weekly pipeline, because that
      # was the only job with all the checkouts on disk. Both package repos are
      # public, so any runner can have them -- which makes this a per-PR check
      # that fails in the pull request that introduces the drift, rather than in
      # the following Monday's metadata PR, which is about something else.
      #
      # Both are checked out at their default branch on purpose. A config change
      # is only really landed once it is on main in all three repos, and that is
      # the state this is asserting.
      - name: Check out Rpkg
        uses: actions/checkout@v4
        with:
          repository: itemresponsewarehouse/Rpkg
          path: _deps/Rpkg

      - name: Check out Python-pkg
        uses: actions/checkout@v4
        with:
          repository: itemresponsewarehouse/Python-pkg
          path: _deps/Python-pkg

      # The unit tests first: they cover the parsers against synthetic files,
      # including the floor that makes a config this can no longer read ERROR
      # instead of comparing three empty sets and reporting green. Run as a
      # script rather than through unittest discovery because metadata/ is not
      # an importable package, unlike red_up/ and irw_validate/ above.
      - name: config parity tests
        run: python metadata/tests/test_config_parity.py -v

      # The reach check's own network step cannot run here -- tests.yml is
      # offline by design -- but its comparison rules can, and they are where
      # the mistakes would be. The script itself runs daily in drift-report.yml
      # (#3091 item 8).
      - name: client reach tests
        run: python metadata/tests/test_client_reach.py -v

      # The release gate's comparison rules. Its network step cannot run here
      # either -- tests.yml is offline by design -- and the gate is meant to be
      # run by hand before a Publish click (red_up/README.md). What is tested
      # here is every rule it decides on, including the three floors that make
      # an unread source an ERROR rather than a clean result.
      - name: release consistency tests
        run: python metadata/tests/test_release_consistency.py -v

      - name: Redivis config parity
        run: |
          python metadata/check_config_parity.py \
            --rpkg  _deps/Rpkg/R/redivis-config.R \
            --pypkg _deps/Python-pkg/src/irw/config.py

      # The ENEM post-scoring checks (#1942). Base R only -- no microdata, no
      # network -- so the thresholds that decide whether a 45-million-row table
      # is publishable are exercised on every PR rather than only when someone
      # has 13 years of INEP files on disk. The test that matters is the
      # false-positive one: a legitimately HARD form must still pass, because
      # difficulty alone must never fail a build.
      - name: enem scoring checks
        working-directory: data
        run: Rscript tests/test_enem_checks.R

      # The conjoint design records: the codes each column may hold, and a row
      # for every table the conjoint ledger marks built or uploaded.
      - name: conjoint design records
        run: python metadata/tests/test_conj_design.py -v

      # The rankings dictionary's release claim. Rankings has no dictionary
      # sheet, and nothing rewrites dictionary_auto_rank.csv after staging, so
      # "Not on Redivis yet." staged with a local table stayed true only until
      # the upload -- it was false of 109 live tables when this was written.
      # Clearing the sentence is the companion edit to flipping a ledger row to
      # `uploaded`, and this is what catches the half that gets forgotten.
      - name: rankings dictionary release claim
        run: python metadata/tests/test_rank_dictionary.py -v

  # A PR to data/ contains a conversion SCRIPT, never a table --
  # automated_finding/irw_output/ is gitignored, so no output is ever in the
  # diff. This checks the script's contract; the data is checked by
  # irw-validate at processing time. See irw_validate/contract.py.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip && python -m pip install -e .

      # Added files block; modified files are annotated and never fail. 776 of
      # the 843 scripts in data/ predate the validator rule, so failing a PR
      # that merely edits one would stall the contributor queue this is meant
      # to unstick.
      - name: Contract
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          added=$(git diff --name-only --diff-filter=A "$base"...HEAD -- 'data/*.py' 'data/*.R' || true)
          modified=$(git diff --name-only --diff-filter=M "$base"...HEAD -- 'data/*.py' 'data/*.R' || true)
          if [ -z "$added$modified" ]; then echo "no data/ scripts in this PR"; exit 0; fi
          args=""
          for f in $added;    do args="$args --added $f";    done
          for f in $modified; do args="$args --modified $f"; done
          python -m irw_validate.contract --annotate $args

      # Advisory, never fails (#2770): a new or changed script that reads
      # .sav/.dta and writes cov_* but was never run through the covariate
      # label harvest gets a warning naming the command to run.
      - name: Covariate label harvest (advisory)
        run: |
          base="origin/${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=AM "$base"...HEAD -- 'data/*.py' 'data/*.R' || true)
          if [ -n "$files" ]; then python metadata/check_label_harvest.py --annotate $files; fi
