# Twice-weekly run of the IRW metadata pipeline -- Workflows 1 and 2 of
# .claude/skills/irw-site-update/SKILL.md.
#
# Regenerates the metadata CSVs from Redivis and the dictionary Google Sheets,
# runs the cross-table audit, and opens a pull request with whatever changed.
#
# Workflow 3 (upload_meta.py) is deliberately NOT run here, exactly as it was
# deliberately not run by the cron script this replaces. Nothing in this job
# touches Redivis publish state. Merging its pull request commits metadata to
# the repository, not to the warehouse; the upload stays a manual, explicit
# step you take afterwards, against the CSVs a `git pull` puts back on disk.
#
# Why the outputs are committed at all:
# the product of this job is the DIFF -- what changed since last week -- and a
# diff needs last week's copy to compare against. Those CSVs used to live only
# on Ben's laptop, gitignored, which is fine for a job that runs on that laptop
# and impossible for one that does not: a fresh runner has no "before" and would
# report everything as new, every week, forever. So git holds the previous copy,
# and `git diff` is the comparison. See the block in .gitignore.
#
# Why this does NOT auto-merge, unlike the version-manifest workflow:
# there, merging unattended is right because the job only records what has
# already happened. Here the review IS the product. The pull request diff is the
# thing to read on Monday -- it replaces a mailed log that was truncated at 60kB
# -- and merging it is the human signal that the changes look right.
name: metadata pipeline

on:
  schedule:
    # Mondays 13:00 UTC, the slot the crontab entry used in local time.
    - cron: "0 13 * * 1"
    # Wednesdays and Fridays too. A second slot was added 2026-10-14 (Thursday)
    # because intake had roughly doubled: the 2026-10-12 run absorbed 692 new
    # tables, took 117 minutes and needed three dispatches, and ~20 data PRs
    # merged in the two days after it had to wait a week for their metadata
    # rows. The third slot is for the ROLLING REFRESH rather than intake --
    # 01_metadata.R re-checks `refresh.per.run` existing tables per run, and
    # that rotation is now the thing that fills tier-0 columns across the
    # corpus (#1710), so runs per week is a sweep-rate knob. Mon/Wed/Fri
    # rather than Mon/Thu/Sat: even spacing, and a PR that lands on a weekday
    # gets reviewed the same day (every run PR since 2026-09-07 merged within
    # an hour).
    - cron: "0 13 * * 3"
    - cron: "0 13 * * 5"
  workflow_dispatch:
    inputs:
      resume_from_run:
        description: >-
          Run ID of a failed run to resume (the number at the end of its URL).
          Its metadata/ outputs are restored and only the stages that had not
          completed are run. Leave blank for a full run.
        required: false
        default: ""
      skip_stages:
        description: >-
          With resume_from_run: stage numbers, space-separated, to record as
          complete before resuming (e.g. "15"). For a stage that cannot finish
          in the run's window; its tracked outputs stay as committed. Blank
          skips nothing.
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Reading another run's artifacts (the resume path) needs this; the default
  # token scope for the job's own artifacts does not cover it.
  actions: read
  # Lets the job request GitHub's own OIDC token for the run, which
  # 02_biblio.R exchanges for a short-lived Anthropic token. Without this
  # GitHub issues no identity token and the exchange has nothing to present.
  id-token: write

concurrency:
  group: metadata-pipeline
  cancel-in-progress: false

jobs:
  decide:
    # Mondays and dispatches always run. Other scheduled slots run only when a
    # core-shard table has appeared or disappeared since metadata.csv was last
    # committed -- otherwise the run's whole diff would be a status.json
    # timestamp and emptied logs (#2342). The gate fails open.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: gate
        env:
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" != "schedule" || "$(date -u +%u)" == "1" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "run=true: ${{ github.event_name }} on $(date -u +%A); not gated"
            exit 0
          fi
          python -m pip install --quiet redivis
          python .claude/skills/irw-site-update/scripts/pipeline_gate.py

  pipeline:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 240, not 120: the 2026-10-12 run took 117 minutes in Workflow 1 and was
    # cancelled by the old limit six seconds after opening its PR (#2971). The
    # stage-16 recompute (#2970) is most of the growth; until it lands, headroom.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        # diff_csv.py -- the script that turns "the CSVs changed" into the
        # readable diff this whole job exists to produce -- imports pandas.
        # Without it stage 01 regenerates metadata.csv fine and then dies
        # reporting what changed, which is the one part that cannot be skipped.
        # redivis: stage 15's README check reads each new table's item names
        # (#2770). Without it those READMEs are left "not checked", not failed.
        run: python -m pip install --upgrade pip && python -m pip install pandas redivis

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          # Posit's package manager serves Linux binaries, so quanteda and the
          # tidyverse install in a minute or two instead of compiling.
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # There is no DESCRIPTION covering metadata/*.R, so the list is
          # explicit: it is the union of every library() call in the stages
          # run_pipeline.sh executes, plus audit_tables.R -- which calls
          # library(irw), the IRW client itself, not on CRAN (Rpkg#147).
          #
          # Keep comments OUT of the block scalar below: a `#` inside a YAML
          # `|` block is literal text, not a comment, so pak receives it as a
          # package name and the whole resolution fails.
          packages: |
            any::dplyr
            any::glue
            any::gsheet
            any::httr
            any::jsonlite
            any::progress
            any::purrr
            any::quanteda
            any::quanteda.textstats
            any::readr
            any::tidyr
            github::redivis/redivis-r
            github::itemresponsewarehouse/Rpkg

      - name: Restore outputs from the run being resumed
        if: github.event.inputs.resume_from_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.inputs.resume_from_run }}
          SKIP_STAGES: ${{ github.event.inputs.skip_stages }}
        run: |
          set -euo pipefail
          # Same-week only. The completed stages' outputs reflect Redivis as it
          # was at that run; a week later they would silently publish a stale
          # view of the warehouse as if freshly computed.
          created="$(gh run view "$RUN_ID" --json createdAt --jq .createdAt)"
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 3600 ))
          if (( age_h > 72 )); then
            echo "::error::run $RUN_ID is ${age_h}h old; resume only within 72h. Dispatch a full run instead."
            exit 1
          fi
          # Into a scratch dir, then over the checkout: `gh run download`
          # refuses to extract onto a file that exists, and the artifact is the
          # whole metadata/ tree, scripts included (first hit 2026-10-15, run
          # 38797586364 -- the first resume ever to reach this step).
          rm -rf /tmp/metadata-outputs
          gh run download "$RUN_ID" --name metadata-outputs --dir /tmp/metadata-outputs
          cp -a /tmp/metadata-outputs/. metadata/
          if [[ ! -f metadata/pipeline_progress.txt ]]; then
            echo "::error::run $RUN_ID left no pipeline_progress.txt; nothing to resume. Dispatch a full run instead."
            exit 1
          fi
          # skip_stages (2026-10-15): stage 15's --deep sweep ran silent for
          # over an hour on 83 deposits and had to be cancelled; the rest of the
          # run should not wait on it. Recorded as complete, --resume skips it
          # and its committed outputs ship unchanged.
          for s in $SKIP_STAGES; do
            [[ "$s" =~ ^[0-9]{2}$ ]] || { echo "::error::skip_stages: '$s' is not a two-digit stage number"; exit 1; }
            grep -qx "$s" metadata/pipeline_progress.txt || echo "$s" >> metadata/pipeline_progress.txt
            echo "Stage $s recorded as complete on request (skip_stages); its committed outputs stand."
          done
          echo "Resuming run $RUN_ID (${age_h}h old). Stages already complete:"
          tr '\n' ' ' < metadata/pipeline_progress.txt; echo
          git status --short -- metadata/ | head -40

      - name: Workflow 1 -- generate and diff
        id: generate
        env:
          # run_pipeline.sh prefers an exported token over ~/.redivis_api_token,
          # which does not exist here. Read-only is all the pipeline needs.
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
          # 02_biblio.R falls back to Claude to generate missing BibTeX. It
          # authenticates by Workload Identity Federation -- it exchanges this
          # run's GitHub OIDC token for a short-lived Anthropic token -- so
          # there is no ANTHROPIC_API_KEY secret in this repository to leak.
          # These three are identifiers, not secrets, and are deliberately in
          # the clear. Do NOT add ANTHROPIC_API_KEY back alongside them: a key
          # in the environment shadows federation, in this script and in every
          # Anthropic SDK, so these would become dead configuration.
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_REPLACE_ME
          ANTHROPIC_ORGANIZATION_ID: 00000000-0000-0000-0000-000000000000
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_REPLACE_ME
          # Only needed if the federation rule covers more than one workspace.
          # ANTHROPIC_WORKSPACE_ID: wrkspc_REPLACE_ME
        run: |
          set -o pipefail
          resume=""
          [[ -n "${{ github.event.inputs.resume_from_run }}" ]] && resume="--resume"
          .claude/skills/irw-site-update/scripts/run_pipeline.sh $resume 2>&1 \
            | tee pipeline.log
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Workflow 2 -- cross-table audit
        env:
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
        run: |
          set -o pipefail
          cd metadata
          Rscript ../.claude/skills/irw-site-update/scripts/audit_tables.R 2>&1 \
            | tee -a ../pipeline.log

      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log
          path: pipeline.log
          retention-days: 90

      - name: Keep the stage outputs so a failed run can be resumed
        # Every outcome, not just failure: a run can die in the audit step
        # after Workflow 1 finished, and the resume needs the outputs either
        # way. ~20 MB; a week is longer than the resume window above.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-outputs
          path: metadata/
          retention-days: 7
          if-no-files-found: warn

      - name: Open a pull request for what changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the tracked outputs. Everything else the run writes -- the
          # *.diff.csv files above all -- stays ignored on purpose.
          if git diff --quiet -- metadata/ ; then
            echo "No metadata changes since the last run; nothing to review."
            exit 0
          fi
          date="$(date -u +%F)"
          branch="metadata/pipeline-$date-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- metadata/
          git commit -m "Metadata pipeline: run for $date" \
                     -m "Automated run of .github/workflows/metadata-pipeline.yml. Workflow 3 (upload_meta.py) not run."
          git push -u origin "$branch"
          {
            echo "Metadata pipeline run for **$date**."
            echo
            echo "## What changed"
            echo
            # HEAD~1, not HEAD: the run's output was committed above, so HEAD
            # already holds it and a diff against HEAD is always empty (#2341).
            python3 .claude/skills/irw-site-update/scripts/summarize_changes.py \
              --ref HEAD~1 --dir metadata
            echo
            echo "## How to review this"
            echo
            echo "1. **Rows removed.** Additions are normal growth; a *removal* means a"
            echo "   table disappeared from Redivis, and that is the line worth stopping"
            echo "   on: name the reason for each one (a withdrawal, a rename) before merging."
            echo "2. **Existing rows changed.** The real signal. A changed"
            echo "   \`n_participants\`, \`density\` or \`responses_per_participant\` on a"
            echo "   table that already existed means the underlying data moved --"
            echo "   either a legitimate re-upload or something wrong upstream."
            echo "3. **Diff size.** Expect hundreds of lines. Tens of thousands means row"
            echo "   canonicalisation has regressed (see canonicalize_csv.py) -- do not"
            echo "   try to read it, file it as a bug."
            echo
            echo "## Straggler watch"
            echo
            # Stage 12 names tables live on Redivis with no metadata.csv row for
            # several runs. run_pipeline.sh brackets its output so the named
            # tables reach the reviewer here rather than only inside the 40kB log
            # tail below -- a finding nobody reads is not a finding. Its exit 1
            # is advisory and does not fail the job; see ADVISORY_STAGE in
            # run_pipeline.sh.
            if grep -q -- "--- ADVISORY 12 BEGIN ---" pipeline.log; then
              # Fenced: the straggler block is aligned plain text and markdown
              # would eat its indentation.
              echo '```'
              sed -n '/--- ADVISORY 12 BEGIN ---/,/--- ADVISORY 12 END ---/p' pipeline.log \
                | sed '1d;$d'
              echo '```'
            else
              echo "_Stage 12 did not run._"
            fi
            echo
            echo "## Coverage audit"
            echo
            # Stage 17 judges every LIVE table against the run's own CSVs: page,
            # citation, licence, tags, script, column docs, codebook link, item
            # text. Report-only. The per-table queue is metadata/coverage_matrix.csv
            # and the readable version metadata/coverage_report.md; a human reads
            # the latter once a month and turns its worst rows into work.
            if grep -q -- "--- ADVISORY 17 BEGIN ---" pipeline.log; then
              echo '```'
              sed -n '/--- ADVISORY 17 BEGIN ---/,/--- ADVISORY 17 END ---/p' pipeline.log \
                | sed '1d;$d'
              echo '```'
              echo
              echo "Full matrix: \`metadata/coverage_matrix.csv\`; monthly review reads \`metadata/coverage_report.md\`."
            else
              echo "_Stage 17 did not run._"
            fi
            echo
            echo "Known noise, safe to skim: \`collections.csv\` definitions rewrite"
            echo "themselves most runs because they embed live coverage counts in their"
            echo "prose. \`n_tables\` is the field there that means something."
            echo
            echo "## Merging publishes nothing"
            echo
            echo "This commits metadata to the repository, not to the warehouse. To push"
            echo "to Redivis afterwards: \`git pull\`, then run \`upload_meta.py\` by hand."
            echo "The full run log is attached to the workflow run as \`pipeline-log\`."
            echo
            echo "<details><summary>Run log (tail)</summary>"
            echo
            echo '```'
            tail -c 40000 pipeline.log
            echo '```'
            echo
            echo "</details>"
          } > pr_body.md
          gh pr create --base main --head "$branch" \
            --title "Metadata pipeline: run for $date" \
            --body-file pr_body.md --assignee ben-domingue

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "@ben-domingue the metadata pipeline failed. Nothing was"
            echo "published -- this job never runs upload_meta.py -- and no pull"
            echo "request was opened, so the committed metadata is untouched."
            echo
            echo "Run: $run_url"
            echo
            echo "To retry without repeating the stages that finished, dispatch the"
            echo "workflow with \`resume_from_run\` = \`$GITHUB_RUN_ID\` (within 72 hours)."
            echo "Stages recorded as complete: $(tr '\n' ' ' < metadata/pipeline_progress.txt 2>/dev/null || echo none)"
            echo
            echo '```'
            tail -c 40000 pipeline.log 2>/dev/null || echo "(no log produced)"
            echo '```'
          } > issue.md
          gh issue create --title "IRW metadata pipeline -- $(date -u +%F) [FAILED]" \
            --body-file issue.md --assignee ben-domingue
