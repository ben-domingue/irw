# Throwaway: exercises metadata/anthropic_auth.R the way 02_biblio.R does --
# federated token, real Messages call. Delete once it has run green.
name: anthropic-rpath-test
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  r-path:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01ULHjDcv36yQt85ftuMdheH
      ANTHROPIC_ORGANIZATION_ID: 74eb46cc-b824-4c2b-b57d-f90e03374cb3
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01AzPY8zbQ17wCtMJDR3gx9n
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::httr, any::jsonlite
      - name: Call Claude through anthropic_auth.R
        run: |
          cd metadata
          Rscript -e '
            source("anthropic_auth.R")
            stopifnot(!nzchar(Sys.getenv("ANTHROPIC_API_KEY")))
            stopifnot(anthropic_federation_configured())
            h <- anthropic_auth_header()
            cat("header name:", names(h), "\n")
            r <- POST(url = "https://api.anthropic.com/v1/messages",
                      add_headers(.headers = c(h, "anthropic-version" = "2023-06-01")),
                      content_type_json(), encode = "json",
                      body = toJSON(list(model = "claude-haiku-4-5", max_tokens = 16,
                                         messages = list(list(role = "user", content = "Reply with the single word: ok"))),
                                    auto_unbox = TRUE))
            cat("status:", status_code(r), "\n")
            if (status_code(r) != 200) { cat(content(r, as = "text", encoding = "UTF-8"), "\n"); quit(status = 1) }
            cat("reply:", content(r, as = "parsed")$content[[1]]$text, "\n")
          '
