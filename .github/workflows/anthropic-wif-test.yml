# Throwaway: proves the Workload Identity Federation setup end to end before
# ci/anthropic-wif merges. Delete once it has run green.
name: anthropic-wif-test
on:
  push:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          echo "event_name: $GITHUB_EVENT_NAME   ref: $GITHUB_REF"
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01ULHjDcv36yQt85ftuMdheH",
            "organization_id": "74eb46cc-b824-4c2b-b57d-f90e03374cb3",
            "service_account_id": "svac_01AzPY8zbQ17wCtMJDR3gx9n"
          }
          JSON
